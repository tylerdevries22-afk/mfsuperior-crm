name: Build Mobile Demo for TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-demo-testflight
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      TZ: America/Denver
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: mobile/package-lock.json
          node-version: 22

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Require Expo token
        run: test -n "$EXPO_TOKEN" || { echo "::error::Configure the EXPO_TOKEN GitHub Actions secret before building the demo."; exit 1; }

      - name: Verify demo release contract
        run: npm run verify:demo
        working-directory: mobile

      - name: Typecheck
        run: npm run typecheck
        working-directory: mobile

      - name: Lint
        run: npm run lint
        working-directory: mobile

      - name: Run tests
        run: npm test -- --runInBand
        working-directory: mobile

      - name: Build and submit SDK 54 demo
        run: npx eas-cli@latest build --profile demo --platform ios --auto-submit-with-profile production --non-interactive --message "MF Superior Products demo"
        working-directory: mobile
