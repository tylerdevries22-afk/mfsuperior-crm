name: Publish Mobile Demo Update

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-demo-update.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      TZ: America/Denver
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: mobile/package-lock.json
          node-version: 22

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Require Expo token
        run: test -n "$EXPO_TOKEN" || { echo "::error::Configure the EXPO_TOKEN GitHub Actions secret before publishing mobile updates."; exit 1; }

      - name: Verify demo release contract
        run: npm run verify:demo
        working-directory: mobile

      - name: Typecheck
        run: npm run typecheck
        working-directory: mobile

      - name: Lint
        run: npm run lint
        working-directory: mobile

      - name: Run tests
        run: npm test -- --runInBand
        working-directory: mobile

      - name: Publish Expo demo update
        run: npm run eas:update:demo
        working-directory: mobile
